<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#FAF8F5"/>
  <defs>
    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C72A8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9D94C4" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="sageGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#63856D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#87A890" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Side: Muted Lavender perspective -->
  <circle cx="216" cy="256" r="110" fill="url(#lavenderGrad)" filter="url(#softBlur)" />

  <!-- Right Side: Sage Green perspective -->
  <circle cx="296" cy="256" r="110" fill="url(#sageGrad)" filter="url(#softBlur)" style="mix-blend-mode: multiply;" />

  <!-- Harmonious center aperture & bridge of shared understanding -->
  <circle cx="256" cy="256" r="46" fill="#FAF8F5" stroke="#FFFFFF" stroke-width="4" />
  <circle cx="256" cy="256" r="16" fill="#3B3654" />
</svg>
