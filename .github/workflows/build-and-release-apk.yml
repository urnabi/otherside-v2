name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/TheOtherSide-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheOtherSide-Android-APK
          path: release-assets/TheOtherSide-v1.0.0.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: THE OTHER SIDE v1.0.0 (Android APK)
          body: |
            ## THE OTHER SIDE — Android Release v1.0.0
            
            Say what you mean. Understand what they hear.
            
            ### Included Assets:
            - **`TheOtherSide-v1.0.0.apk`**: Standalone native Android installation file.
            
            ### How to Install on Android:
            1. Download `TheOtherSide-v1.0.0.apk` on your Android device.
            2. Tap the downloaded file in your browser downloads or Files app.
            3. If prompted, allow "Install from this source".
            4. Tap **Install** and open **THE OTHER SIDE**!
          draft: false
          prerelease: false
          files: release-assets/TheOtherSide-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
